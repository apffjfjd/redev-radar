[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redev-radar"
version = "0.1.0"
description = "역세권 재개발 빌라 경매물건 탐색기 (BD-0004) — MVP: 후보지역 발굴"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redev-radar = "redev_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redev_radar = ["web/*", "criteria/seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
